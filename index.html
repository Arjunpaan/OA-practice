<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OA Top 200</title>
<style>
:root{--bg:#0b1220;--card:#111a2e;--bd:#1e2b47;--tx:#e6ecf8;--mu:#7d8db0;--ac:#38bdf8;--ok:#34d399;--m:#fbbf24;--h:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=dark]){}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}.sub{color:var(--mu);font-size:13px;margin:2px 0 14px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .3s}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.st div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.st b{display:block;font-size:22px}.st small{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.f input{flex:1 1 180px;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:8px 10px;border-radius:8px}
button{background:var(--card);border:1px solid var(--bd);color:var(--mu);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}button.on{color:var(--tx);border-color:var(--ac);background:#12304a}
.r{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.r.d{opacity:.55}.r.d a{text-decoration:line-through}
.n{color:var(--mu);font:12px monospace;width:28px}.ck{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
.r a{flex:1;color:var(--tx);text-decoration:none;font-weight:500}.r a:hover{color:var(--ac)}
.t{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid}.M{color:var(--m)}.H{color:var(--h)}.c{color:var(--mu);font-size:12px;white-space:nowrap}
.s{background:none;border:0;color:var(--mu);padding:2px 6px;font-size:16px}.s.on{color:var(--m);background:none}
.tl{margin-left:auto}@media(max-width:520px){.c{display:none}.st{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="w">

const sv=()=>{try{localStorage.setItem('oa200',JSON.stringify(S))}catch(e){}};
function R(){const l=document.getElementById('l');l.innerHTML='';let n=0;
P.forEach(p=>{const dn=!!S.done[p.i],st=!!S.star[p.i];

if(Q&&!p.t.toLowerCase().includes(Q))return;
const r=document.createElement('div');r.className='r'+(dn?' d':'');
r.innerHTML=`<span class=n>${p.i}</span><input type=checkbox class=ck ${dn?'checked':''}><a href="${p.u}" target=_blank rel=noopener>${p.t}</a><span class=c>${p.c} companies</span><span class="t ${p.d}">${p.d=='H'?'Hard':'Med'}</span><button class="s ${st?'on':''}">${st?'★':'☆'}</button>`;
